target-version = "py312"
line-length = 120

[lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "B",    # flake8-bugbear
  "S",    # bandit (security)
  "UP",   # pyupgrade
  "SIM",  # flake8-simplify
  "RUF",  # ruff-specific rules
]
ignore = [
  "S101",    # assert used (fine in tests and validation)
  "S104",    # bind all interfaces (required for container deployments)
  "S108",    # /tmp usage (required for ADK agent staging)
  "S311",    # random not for crypto (we use it for particle seeding)
  "E501",    # line too long (handled by formatter)
  "B008",    # function call in default arg (FastAPI Depends pattern)
  "RUF002",  # ambiguous unicode in docstrings (we use Greek letters for math)
  "RUF003",  # ambiguous unicode in comments (we use Greek letters for math)
  "SIM108",  # ternary operator (readability preference)
]

[lint.per-file-ignores]
"backend/solver/*.py" = ["S101"]  # asserts OK in solver validation

[format]
quote-style = "double"
