server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback — every unknown path serves index.html so React Router
  # (and direct refreshes on deep links) work.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache hashed Vite assets aggressively; never cache index.html.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location = /index.html {
    add_header Cache-Control "no-store";
  }
}
