# Protein demo Cluster Toolkit blueprint.
# Extends the slurm-multi-region-gpu pattern with TPU v6e + GPU A100 nodesets.
#
# Two partitions:
#   tpu  — TPU v6e Spot across 7 CONUS zones (Weight 1-7)
#   gpu  — GPU A100/H100 Spot across CONUS zones (Weight 1-6)
#
# Researcher submits:
#   sbatch -p tpu predict.sh --model=af2
#   sbatch -p gpu predict.sh --model=af2
#   (or frontend "Submit All" fires both)
#
# Slurm tries nodesets in Weight order, auto-provisions Spot in whichever
# zone has capacity first. Same pattern as WandLZhang/slurm-multi-region-gpu.

---
blueprint_name: nih-proteins

validators:
- validator: test_machine_type_in_zone
  skip: true

vars:
  deployment_name: nih-proteins
  project_id: wz-nih-demo-burst
  region: us-east5
  zone: us-east5-a

  instance_image:
    project: schedmd-slurm-public
    family: slurm-gcp-6-11-ubuntu-2204-lts-nvidia-570

  disk_size_gb: 100

deployment_groups:

# -------------------------------------------------------------------
# cluster-env: VPC refs per region for cross-region nodesets
# -------------------------------------------------------------------
- group: cluster-env
  modules:
  - id: default_vpc_west1
    source: modules/network/pre-existing-vpc
    settings: { network_name: default, subnetwork_name: default, region: us-west1 }

  - id: default_vpc_east5
    source: modules/network/pre-existing-vpc
    settings: { network_name: default, subnetwork_name: default, region: us-east5 }

  - id: default_vpc_central1
    source: modules/network/pre-existing-vpc
    settings: { network_name: default, subnetwork_name: default, region: us-central1 }

  - id: default_vpc_east1
    source: modules/network/pre-existing-vpc
    settings: { network_name: default, subnetwork_name: default, region: us-east1 }

  # GCS bucket for model weights, MSAs, results
  - id: gcs_bucket
    source: modules/file-system/cloud-storage-bucket
    settings:
      enable_hierarchical_namespace: true
      local_mount: /gcs
      random_suffix: true
      mount_options: "implicit_dirs,dir_mode=777,file_mode=777,allow_other"

# -------------------------------------------------------------------
# cluster: TPU + GPU nodesets, partitions, controller
# -------------------------------------------------------------------
- group: cluster
  modules:

  # ===================================================================
  # TPU v6e Spot nodesets — ordered by Spot capacity (May 2026 dashboard)
  # ===================================================================

  # TPU v6e Spot — us-west1-c (22,652 Spot capacity — largest pool)
  - id: tpu_v6e_west1c
    source: community/modules/compute/schedmd-slurm-gcp-v6-nodeset
    use: [default_vpc_west1]
    settings:
      machine_type: ct6e-standard-4t
      region: us-west1
      zone: us-west1-c
      enable_public_ips: false
      enable_spot_vm: true
      spot_instance_config: { termination_action: STOP }
      node_count_static: 0
      node_count_dynamic_max: 2
      enable_placement: false
      node_conf: { Feature: tpu-v6e, Weight: 1 }

  # TPU v6e Spot — us-east5-b (7,066 capacity)
  - id: tpu_v6e_east5b
    source: community/modules/compute/schedmd-slurm-gcp-v6-nodeset
    use: [default_vpc_east5]
    settings:
      machine_type: ct6e-standard-4t
      region: us-east5
      zone: us-east5-b
      enable_public_ips: false
      enable_spot_vm: true
      spot_instance_config: { termination_action: STOP }
      node_count_static: 0
      node_count_dynamic_max: 2
      enable_placement: false
      node_conf: { Feature: tpu-v6e, Weight: 2 }

  # TPU v6e Spot — us-east5-a (4,356 capacity)
  - id: tpu_v6e_east5a
    source: community/modules/compute/schedmd-slurm-gcp-v6-nodeset
    use: [default_vpc_east5]
    settings:
      machine_type: ct6e-standard-4t
      region: us-east5
      zone: us-east5-a
      enable_public_ips: false
      enable_spot_vm: true
      spot_instance_config: { termination_action: STOP }
      node_count_static: 0
      node_count_dynamic_max: 2
      enable_placement: false
      node_conf: { Feature: tpu-v6e, Weight: 3 }

  # TPU v6e Spot — us-central1-b (3,800 capacity)
  - id: tpu_v6e_central1b
    source: community/modules/compute/schedmd-slurm-gcp-v6-nodeset
    use: [default_vpc_central1]
    settings:
      machine_type: ct6e-standard-4t
      region: us-central1
      zone: us-central1-b
      enable_public_ips: false
      enable_spot_vm: true
      spot_instance_config: { termination_action: STOP }
      node_count_static: 0
      node_count_dynamic_max: 2
      enable_placement: false
      node_conf: { Feature: tpu-v6e, Weight: 4 }

  # TPU v6e Spot — us-east1-d (2,690 capacity)
  - id: tpu_v6e_east1d
    source: community/modules/compute/schedmd-slurm-gcp-v6-nodeset
    use: [default_vpc_east1]
    settings:
      machine_type: ct6e-standard-4t
      region: us-east1
      zone: us-east1-d
      enable_public_ips: false
      enable_spot_vm: true
      spot_instance_config: { termination_action: STOP }
      node_count_static: 0
      node_count_dynamic_max: 2
      enable_placement: false
      node_conf: { Feature: tpu-v6e, Weight: 5 }

  # ===================================================================
  # GPU A100 Spot nodesets — for AF2-GPU, ESMFold-GPU, Boltz-2-GPU
  # ===================================================================

  # A100 80GB (A2-ultra) — us-central1 (largest A2-ultra pool: 1,538 cap)
  - id: a100_spot_central1
    source: community/modules/compute/schedmd-slurm-gcp-v6-nodeset
    use: [default_vpc_central1]
    settings:
      machine_type: a2-ultragpu-1g
      region: us-central1
      zone: us-central1-c
      zones: [us-central1-a]
      enable_public_ips: false
      enable_spot_vm: true
      spot_instance_config: { termination_action: STOP }
      node_count_static: 0
      node_count_dynamic_max: 2
      enable_placement: false
      on_host_maintenance: TERMINATE
      node_conf: { Feature: a100,gpu, Weight: 1 }

  # A100 80GB — us-east5-b (299 cap)
  - id: a100_spot_east5
    source: community/modules/compute/schedmd-slurm-gcp-v6-nodeset
    use: [default_vpc_east5]
    settings:
      machine_type: a2-ultragpu-1g
      region: us-east5
      zone: us-east5-b
      enable_public_ips: false
      enable_spot_vm: true
      spot_instance_config: { termination_action: STOP }
      node_count_static: 0
      node_count_dynamic_max: 2
      enable_placement: false
      on_host_maintenance: TERMINATE
      node_conf: { Feature: a100,gpu, Weight: 2 }

  # ===================================================================
  # Partitions
  # ===================================================================

  # TPU partition — all TPU v6e nodesets
  - id: tpu_partition
    source: community/modules/compute/schedmd-slurm-gcp-v6-partition
    use:
    - tpu_v6e_west1c       # W1 — 22,652 Spot capacity
    - tpu_v6e_east5b       # W2 — 7,066
    - tpu_v6e_east5a       # W3 — 4,356
    - tpu_v6e_central1b    # W4 — 3,800
    - tpu_v6e_east1d       # W5 — 2,690
    settings:
      partition_name: tpu
      exclusive: false
      partition_conf:
        ResumeTimeout: 900
        SuspendTimeout: 300

  # GPU partition — A100 nodesets
  - id: gpu_partition
    source: community/modules/compute/schedmd-slurm-gcp-v6-partition
    use:
    - a100_spot_central1   # W1
    - a100_spot_east5      # W2
    settings:
      partition_name: gpu
      is_default: true
      exclusive: false
      partition_conf:
        ResumeTimeout: 900
        SuspendTimeout: 300

  # ===================================================================
  # Login + Controller
  # ===================================================================

  - id: slurm_login
    source: community/modules/scheduler/schedmd-slurm-gcp-v6-login
    use: [default_vpc_east5]
    settings:
      disk_size_gb: 100
      enable_login_public_ips: false
      machine_type: n2-standard-4

  - id: slurm_controller
    source: community/modules/scheduler/schedmd-slurm-gcp-v6-controller
    use:
    - default_vpc_east5
    - tpu_partition
    - gpu_partition
    - slurm_login
    - gcs_bucket
    settings:
      enable_controller_public_ips: false
      disk_type: pd-ssd
      disk_size_gb: 200
      machine_type: n2-standard-8
      enable_external_prolog_epilog: true
